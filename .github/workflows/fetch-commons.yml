# Downloads Wikimedia Commons photos for Ascent's news graphics from GitHub's servers.
# The Claude cloud runner shares an outbound IP that Wikimedia throttles (429, Retry-After up to 600 s),
# so the daily routine pushes a request file here and reads the downloaded files back from the repo.
#
# Request: fetch/requests/<batch>.txt, one Commons file name per line ("File:Name.jpg"), optional
#          " | 1920" after a name to get a standard-width thumbnail instead of the original.
# Result:  fetch/files/<batch>/<safe name> plus fetch/files/<batch>/results.json.
name: Fetch Commons photos

on:
  push:
    paths:
      - "fetch/requests/*.txt"
  workflow_dispatch:
    inputs:
      batch:
        description: "Request file name without .txt"
        required: true

permissions:
  contents: write

concurrency:
  group: fetch-commons
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download requested files
        env:
          UA: "AscentNewsBot/1.0 (https://ascentcapitalraise.com; news graphics with attribution)"
          BATCH_INPUT: ${{ github.event.inputs.batch }}
        run: |
          set -u
          if [ -n "${BATCH_INPUT:-}" ]; then
            reqs="fetch/requests/${BATCH_INPUT}.txt"
          else
            reqs=$(git diff --name-only HEAD~1 HEAD -- 'fetch/requests/*.txt' || true)
          fi
          for req in $reqs; do
            [ -f "$req" ] || continue
            batch=$(basename "$req" .txt)
            out="fetch/files/$batch"
            mkdir -p "$out"
            python3 - "$req" "$out" <<'PY'
          import hashlib, json, os, re, sys, time, urllib.parse, urllib.request
          req, out = sys.argv[1], sys.argv[2]
          ua = os.environ["UA"]
          results = []
          for raw in open(req, encoding="utf8"):
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              name, _, width = (part.strip() for part in line.partition("|"))
              name = name.removeprefix("File:").replace(" ", "_")
              h = hashlib.md5(name.encode("utf8")).hexdigest()
              q = urllib.parse.quote(name)
              url = f"https://upload.wikimedia.org/wikipedia/commons/{h[0]}/{h[:2]}/{q}"
              if width:
                  url = f"https://upload.wikimedia.org/wikipedia/commons/thumb/{h[0]}/{h[:2]}/{q}/{width}px-{q}"
              dest = os.path.join(out, re.sub(r"[^A-Za-z0-9._-]", "_", name))
              status = "failed"
              for attempt in range(5):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": ua}), timeout=60)
                      open(dest, "wb").write(r.read())
                      status = "ok"
                      break
                  except urllib.error.HTTPError as e:
                      status = f"http {e.code}"
                      if e.code == 429:
                          time.sleep(min(int(e.headers.get("Retry-After") or 30), 300))
                          continue
                      break
                  except Exception as e:  # network hiccup
                      status = f"error {e}"
                      time.sleep(10)
              results.append({"file": "File:" + name, "url": url, "path": dest, "status": status,
                              "bytes": os.path.getsize(dest) if status == "ok" else 0})
              time.sleep(3)
          json.dump(results, open(os.path.join(out, "results.json"), "w"), indent=1)
          print(json.dumps(results, indent=1))
          PY
          done

      - name: Commit files
        run: |
          git config user.name "ascent-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fetch/files
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Fetch Commons photos for $(ls fetch/files | tail -1)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
